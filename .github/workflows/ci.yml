name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint (Biome)
        run: bun run lint
      - name: Type check (tsc --noEmit)
        run: bun run typecheck
      - name: Test
        run: bun run test
      # 配布用バンドルが作れること、バンドルが相対パスと claude-code 以外を import していないこと、各ファイルが上限サイズ未満であることを確かめる
      # （検査は scripts/build.ts の中にある）。
      - name: Build bundle
        run: bun run build
      # Claude Code 自身の検査。マニフェストとフックモジュールを読む検証（--strict で警告もエラー扱い）と、
      # 実際のエンジンの上でのテスト（hooks/register.test.ts を、作ったバンドルに対して実行）。ログインは不要。
      # CLI は devDependencies の @anthropic-ai/claude-code（bun.lock で固定、dependabot が更新）を使う。
      - name: Validate plugin (claude plugin validate --strict)
        run: bun run validate:plugin
      - name: Plugin tests on the real engine (claude plugin test)
        run: bun run test:plugin
