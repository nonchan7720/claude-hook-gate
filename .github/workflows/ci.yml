name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint (Biome)
        run: bun run lint
      - name: Type check (tsc --noEmit)
        run: bun run typecheck
      - name: Test
        run: bun run test
      # 配布用バンドルが作れること、バンドルが相対パスと claude-code 以外を import していないこと、各ファイルが上限サイズ未満であることを確かめる
      # （検査は scripts/build.ts の中にある）。
      - name: Build bundle
        run: bun run build
      # Claude Code 自身の検査。マニフェストとフックモジュールを読む検証（--strict で警告もエラー扱い）と、
      # 実際のエンジンの上でのテスト（hooks/register.test.ts を、直前に作ったバンドルに対して実行）。ログインは不要。
      # CLI の版はここで固定する（上げるときはこの 1 行を変える）。
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Validate plugin (claude plugin validate --strict)
        run: claude plugin validate . --strict
      - name: Plugin tests on the real engine (claude plugin test)
        run: claude plugin test .
