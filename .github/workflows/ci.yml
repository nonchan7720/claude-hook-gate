name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint (Biome)
        run: bun run lint
      - name: Type check (tsc --noEmit)
        run: bun run typecheck
      - name: Test
        run: bun run test
      # 配布用バンドルが作れること、バンドルが相対パスと claude-code 以外を import していないことを確かめる
      # （検査は scripts/build.ts の中にある）。
      - name: Build bundle
        run: bun run build
