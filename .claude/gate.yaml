# yaml-language-server: $schema=../scripts/gate.schema.json
rules:
  - match:
      - src/**/*.ts
      - tests/**/*.ts
      - scripts/**/*.ts
      - hooks/register.test.ts
    run:
      - parallel:
          - name: lint
            cmd: bun run lint
          - name: typecheck
            cmd: bun run typecheck
          - name: test
            cmd: bun run test
    run_checks:
      - verify
  - match:
      - "**/*.go"
      - go.mod
      - locales/*.yaml
    run:
      - parallel:
          - name: go-lint
            cmd: golangci-lint run ./...
          - name: go-fmt
            cmd: golangci-lint fmt --diff ./...
          - name: go-test
            cmd: go test ./...
    run_checks:
      - verify

consistency_checks:
  - name: verify
    run:
      - parallel:
          - name: lint
            cmd: bun run lint
          - name: typecheck
            cmd: bun run typecheck
          - name: go-lint
            cmd: golangci-lint run ./...
          - name: go-test
            cmd: go test ./...
          - name: test
            cmd: bun run test
      - name: test-plugin
        cmd: bun run test:plugin
