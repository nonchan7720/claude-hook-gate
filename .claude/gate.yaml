# yaml-language-server: $schema=../scripts/gate.schema.json
rules:
  - match:
      - src/**/*.ts
      - tests/**/*.ts
      - scripts/**/*.ts
      - hooks/register.test.ts
    run:
      - parallel:
          - name: lint
            cmd: bun run lint
          - name: typecheck
            cmd: bun run typecheck
          - name: test
            cmd: bun run test
    run_checks:
      - verify

consistency_checks:
  - name: verify
    run:
      - parallel:
          - name: lint
            cmd: bun run lint
          - name: typecheck
            cmd: bun run typecheck
          - name: test
            cmd: bun run test
      - name: test-plugin
        cmd: bun run test:plugin
